<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Partner Explorer · Sophos Fusion Tenant Migration</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body class="shell">
  <div class="bg" aria-hidden="true"><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-glow bg-glow-c"></div><div class="bg-noise"></div></div>
  <aside id="app-rail" class="rail"></aside>
  <div class="shell-main">
  <header id="app-nav" class="topbar"></header>

  <main class="page-main">
    <h1>Partner Explorer</h1>
    <p class="page-lead">Browse all tenants managed by your partner account and search for
      endpoints across every tenant.</p>

    <!-- Global endpoint search -->
    <section class="panel-card" style="margin-bottom:1.25rem;">
      <div class="panel-toolbar">
        <h2 style="margin:0;">Endpoint search (all tenants)</h2>
        <span class="spacer"></span>
      </div>
      <p class="hint" style="margin-bottom:0.75rem;">Search by hostname across every managed
        tenant. Results show which tenant each device belongs to.</p>
      <div class="panel-toolbar">
        <input type="search" id="global-search" placeholder="Enter hostname…" style="min-width:300px;" />
        <button id="global-search-btn" class="btn btn-primary">Search</button>
      </div>
      <div id="global-results"></div>
    </section>

    <!-- Tenant list -->
    <section class="panel-card">
      <div class="panel-toolbar">
        <h2 style="margin:0;">Managed tenants</h2>
        <span class="spacer"></span>
        <input type="search" id="filter-tenants" placeholder="Filter by name…" />
        <span id="tenant-count" class="hint"></span>
      </div>
      <div id="tenant-list"><div class="empty-state">Loading…</div></div>
    </section>

    <!-- Tenant drill-down panel -->
    <section class="panel-card hidden" id="tenant-detail" style="margin-top:1.25rem;">
      <div class="panel-toolbar">
        <h2 id="detail-title" style="margin:0;">Tenant detail</h2>
        <span class="spacer"></span>
        <button id="close-detail" class="btn btn-small">Close</button>
      </div>
      <div id="detail-body"></div>
    </section>
  </main>

  <footer id="page-footer" class="page-footer"></footer>
  </div>
  <script type="module" src="/js/page-partner-explorer.js"></script>
</body>
</html>
