<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Endpoints · Sophos Fusion Tenant Migration</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <header id="app-nav" class="app-nav"></header>

  <main class="page-main">
    <h1>Endpoints</h1>
    <p class="page-lead">Browse devices on both tenants. Select devices and migrate them
      in either direction — source to destination or destination back to source.</p>

    <div class="panel-toolbar" style="margin-bottom:1rem;">
      <label class="checkbox" style="margin:0;">
        <input type="checkbox" id="hide-stale" />
        Hide stale devices (outside 14-day window)
      </label>
    </div>

    <div class="split-row">
      <section class="panel-card">
        <div class="panel-toolbar">
          <h2>Source</h2>
          <span class="spacer"></span>
          <input type="search" id="search-source" placeholder="Filter…" />
          <button class="btn btn-small" id="select-all-source">Select all</button>
        </div>
        <div id="table-source"><div class="empty-state">Loading…</div></div>
      </section>
      <section class="panel-card">
        <div class="panel-toolbar">
          <h2>Destination</h2>
          <span class="spacer"></span>
          <input type="search" id="search-dest" placeholder="Filter…" />
          <button class="btn btn-small" id="select-all-dest">Select all</button>
        </div>
        <div id="table-dest"><div class="empty-state">Loading…</div></div>
      </section>
    </div>
  </main>

  <div id="selection-basket" class="selection-basket hidden">
    <span id="basket-text"></span>
    <button id="basket-clear" class="btn">Clear</button>
    <button id="basket-migrate" class="btn btn-primary">Migrate selected →</button>
  </div>

  <footer id="page-footer" class="page-footer"></footer>
  <script type="module" src="/js/page-endpoints.js"></script>
</body>
</html>
