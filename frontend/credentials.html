<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credentials — Sophos Central Migration Tool</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <header id="app-nav" class="app-nav"></header>

  <main class="page-main">
    <h1>API Credentials</h1>
    <p class="page-lead">Switch between direct-tenant and partner mode, edit credentials,
      and test connections. Changes take effect immediately — no restart needed.</p>

    <section class="panel-card" style="margin-bottom:1.25rem;">
      <h2>Credential mode</h2>
      <div class="mode-picker" style="flex-direction:row;">
        <label class="mode-option" style="flex:1;">
          <input type="radio" name="cred-mode" value="direct" checked />
          <div class="mode-card">
            <strong>Direct tenant</strong>
            <p>Separate Client ID / Secret per tenant.</p>
          </div>
        </label>
        <label class="mode-option" style="flex:1;">
          <input type="radio" name="cred-mode" value="partner" />
          <div class="mode-card">
            <strong>Partner / organization</strong>
            <p>One credential set, pick tenants from the list.</p>
          </div>
        </label>
      </div>
    </section>

    <!-- Direct mode panels -->
    <div id="direct-panels">
      <section class="cred-card">
        <h2>Source tenant</h2>
        <form class="cred-form" data-side="source">
          <label>Friendly label
            <input type="text" name="label" autocomplete="off" spellcheck="false" placeholder="Acme Corp" />
          </label>
          <label>Client ID
            <input type="text" name="clientId" autocomplete="off" spellcheck="false" />
          </label>
          <label>Client Secret
            <div class="input-with-button">
              <input type="password" name="clientSecret" autocomplete="off" />
              <button type="button" class="btn btn-small reveal-btn">Reveal</button>
            </div>
            <div class="hint" data-field="clientSecret-hint"></div>
          </label>
          <div class="form-actions">
            <button type="button" class="btn test-btn">Test connection</button>
            <button type="button" class="btn btn-primary save-btn">Save &amp; reconnect</button>
          </div>
          <div class="banner hidden" data-field="banner"></div>
        </form>
      </section>

      <section class="cred-card" style="margin-top:1.25rem;">
        <h2>Destination tenant</h2>
        <form class="cred-form" data-side="dest">
          <label>Friendly label
            <input type="text" name="label" autocomplete="off" spellcheck="false" placeholder="Acme Corp - New" />
          </label>
          <label>Client ID
            <input type="text" name="clientId" autocomplete="off" spellcheck="false" />
          </label>
          <label>Client Secret
            <div class="input-with-button">
              <input type="password" name="clientSecret" autocomplete="off" />
              <button type="button" class="btn btn-small reveal-btn">Reveal</button>
            </div>
            <div class="hint" data-field="clientSecret-hint"></div>
          </label>
          <div class="form-actions">
            <button type="button" class="btn test-btn">Test connection</button>
            <button type="button" class="btn btn-primary save-btn">Save &amp; reconnect</button>
          </div>
          <div class="banner hidden" data-field="banner"></div>
        </form>
      </section>
    </div>

    <!-- Partner mode panel -->
    <div id="partner-panel" class="hidden">
      <section class="cred-card">
        <h2>Partner / organization credentials</h2>
        <form id="partner-cred-form" class="cred-form">
          <label>Friendly label
            <input type="text" name="label" autocomplete="off" spellcheck="false" />
          </label>
          <label>Client ID
            <input type="text" name="clientId" autocomplete="off" spellcheck="false" />
          </label>
          <label>Client Secret
            <div class="input-with-button">
              <input type="password" name="clientSecret" autocomplete="off" />
              <button type="button" class="btn btn-small reveal-btn">Reveal</button>
            </div>
            <div class="hint" data-field="clientSecret-hint"></div>
          </label>
          <div class="form-actions">
            <button type="button" class="btn" id="test-partner-btn">Test &amp; load tenants</button>
          </div>
          <div class="banner hidden" data-field="banner"></div>
        </form>
      </section>

      <section class="cred-card" style="margin-top:1.25rem;" id="partner-tenant-section">
        <h2>Select tenants</h2>
        <div class="cred-form">
          <label>Source tenant
            <select id="p-source-select"><option value="">— select —</option></select>
          </label>
          <label>Source label <span class="hint">(override the tenant name)</span>
            <input type="text" id="p-source-label" autocomplete="off" spellcheck="false" />
          </label>
          <label>Destination tenant
            <select id="p-dest-select"><option value="">— select —</option></select>
          </label>
          <label>Destination label <span class="hint">(override the tenant name)</span>
            <input type="text" id="p-dest-label" autocomplete="off" spellcheck="false" />
          </label>
        </div>
        <div class="form-actions" style="margin-top:1rem;">
          <button type="button" class="btn btn-primary" id="save-partner-btn">Save &amp; reconnect</button>
        </div>
        <div class="banner hidden" id="partner-save-banner"></div>
      </section>
    </div>
  </main>

  <footer id="page-footer" class="page-footer"></footer>
  <script type="module" src="/js/page-credentials.js"></script>
</body>
</html>
