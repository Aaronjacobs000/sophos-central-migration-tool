<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Sophos Fusion Tenant Migration</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body class="shell">
  <div class="bg" aria-hidden="true"><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-glow bg-glow-c"></div><div class="bg-noise"></div></div>
  <aside id="app-rail" class="rail"></aside>
  <div class="shell-main">
  <header id="app-nav" class="topbar"></header>

  <main class="page-main">
    <section class="hero glass" aria-labelledby="hero-route">
      <div class="hero-top">
        <span class="eyebrow">Migration route</span>
        <span class="spacer"></span>
        <button type="button" class="btn btn-small" id="details-toggle" aria-expanded="false" aria-controls="conn-details">Connection details</button>
      </div>
      <h1 id="hero-route" class="hero-route">
        <span class="hero-side" data-side="source"><span class="conn-dot"></span><span class="hero-name">Source</span></span>
        <span class="hero-arrow" aria-label="to"></span>
        <span class="hero-side" data-side="dest"><span class="conn-dot"></span><span class="hero-name">Destination</span></span>
      </h1>
      <p class="hero-meta" id="hero-meta">Checking both tenants</p>
      <div class="drawer hidden" id="conn-details">
        <div class="drawer-grid">
          <div><h3 class="side-title">Source</h3><div class="tile-body" data-body="source"></div></div>
          <div><h3 class="side-title is-dest">Destination</h3><div class="tile-body" data-body="dest"></div></div>
        </div>
      </div>
    </section>

    <section class="journey" id="journey" aria-label="Migration steps"></section>

    <section class="panel-card">
      <div class="card-head">
        <h2>Preloaded data</h2>
        <span id="preload-summary" class="preload-summary"></span>
        <span class="spacer"></span>
        <button id="preload-restart" class="btn btn-small">Restart preload</button>
        <a href="/logs.html" class="btn btn-small">View logs</a>
      </div>
      <p class="card-sub">After credentials are saved the tool loads these sections for both tenants in the background, so list pages open instantly. Refresh a side if it failed.</p>
      <div id="preload-grid" class="count-grid"><div class="empty-state">Loading</div></div>
    </section>
  </main>

  <footer id="page-footer" class="page-footer"></footer>
  </div>
  <script type="module" src="/js/page-dashboard.js"></script>
</body>
</html>
