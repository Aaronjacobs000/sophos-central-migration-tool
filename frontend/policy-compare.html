<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Policy compare · Sophos Fusion Tenant Migration</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <header id="app-nav" class="app-nav"></header>

  <main class="page-main">
    <h1 id="page-title">Policy compare</h1>
    <p class="page-lead" id="page-lead">Loading…</p>

    <section class="panel-card" id="header-card">
      <div id="header-area"><div class="empty-state">Loading…</div></div>
    </section>

    <section class="panel-card" style="margin-top:1rem;" id="compare-card" hidden>
      <div class="panel-toolbar">
        <h2 style="margin:0;">Settings</h2>
        <span class="spacer"></span>
        <input type="search" id="filter" placeholder="Filter by setting path…" />
        <label class="checkbox" style="margin-top:0;">
          <input type="checkbox" id="show-only-diffs" checked />
          Differences only
        </label>
      </div>
      <div id="compare-body"></div>
    </section>
  </main>

  <footer id="page-footer" class="page-footer"></footer>
  <script type="module" src="/js/page-policy-compare.js"></script>
</body>
</html>
