<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exclusions — Sophos Central Migration Tool</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <header id="app-nav" class="app-nav"></header>

  <main class="page-main">
    <h1>Exclusions &amp; allow/block lists</h1>
    <p class="page-lead">Browse scanning exclusions, allowed items and blocked items on both
      tenants. Select source items and copy them to destination.</p>

    <div class="tabs">
      <button class="tab active" data-tab="scanning">Scanning exclusions</button>
      <button class="tab" data-tab="allowed-items">Allowed items</button>
      <button class="tab" data-tab="blocked-items">Blocked items</button>
    </div>

    <div class="split-row">
      <section class="panel-card">
        <div class="panel-toolbar">
          <h2>Source</h2>
          <span class="spacer"></span>
          <button id="select-all-source" class="btn btn-small">Select all</button>
          <button id="clear-source" class="btn btn-small">Clear</button>
        </div>
        <div id="table-source"><div class="empty-state">Loading…</div></div>
      </section>
      <section class="panel-card">
        <div class="panel-toolbar">
          <h2>Destination</h2>
          <span class="spacer"></span>
        </div>
        <div id="table-dest"><div class="empty-state">Loading…</div></div>
      </section>
    </div>
  </main>

  <div id="selection-basket" class="selection-basket hidden">
    <span><span id="basket-count">0</span> source items selected</span>
    <button id="basket-copy" class="btn btn-primary">Copy to destination</button>
  </div>

  <footer id="page-footer" class="page-footer"></footer>
  <script type="module" src="/js/page-exclusions.js"></script>
</body>
</html>
