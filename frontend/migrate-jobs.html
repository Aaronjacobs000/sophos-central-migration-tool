<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Migration jobs · Sophos Fusion Tenant Migration</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body class="shell">
  <div class="bg" aria-hidden="true"><div class="bg-glow bg-glow-a"></div><div class="bg-glow bg-glow-b"></div><div class="bg-glow bg-glow-c"></div><div class="bg-noise"></div></div>
  <aside id="app-rail" class="rail"></aside>
  <div class="shell-main">
  <header id="app-nav" class="topbar"></header>

  <main class="page-main">
    <h1>Migrations</h1>
    <p class="page-lead">Device migration jobs across both tenants, including jobs started outside this tool.</p>

    <div class="tab-bar" id="jobs-tabs">
      <button class="tab-btn active" data-tab="all">All migrations</button>
      <button class="tab-btn" data-tab="local">This workstation</button>
    </div>

    <section class="panel-card">
      <div id="jobs-list"><div class="empty-state">Loading</div></div>
    </section>
  </main>

  <footer id="page-footer" class="page-footer"></footer>
  </div>
  <script type="module" src="/js/page-migrate-jobs.js"></script>
</body>
</html>
